name: tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 .github/scripts/validate-maintenance.py

  assets:
    needs: maintenance
    uses: ./.github/workflows/compile-assets.yml

  static-analysis:
    needs: assets
    uses: ./.github/workflows/static-analysis.yml

  tests:
    needs: static-analysis
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
        laravel: [10, 11, 12, '13']
        include:
          - php: 8.2
            laravel: 9
          - php: 8.1
            laravel: 9
          - php: '8.0'
            laravel: 9
          - php: 8.1
            laravel: 8
          - php: '8.0'
            laravel: 8
          - php: '8.3'
            laravel: '13'
        exclude:
          - php: 8.4
            laravel: 10
          - php: 8.5
            laravel: 10
          - php: 8.5
            laravel: 11
          - php: 8.1
            laravel: 11
          - php: 8.1
            laravel: 12
          - laravel: '13'
            php: 8.1
          - laravel: '13'
            php: 8.2

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, json, libxml, mbstring, zip
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress --with="illuminate/contracts:^${{ matrix.laravel }}"

      - name: Execute tests
        run: vendor/bin/phpunit ${{ matrix.laravel >= 10 && '--display-deprecations --fail-on-deprecation' || '' }}
